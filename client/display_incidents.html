<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Incidents - SportsPro Technical Support</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-content">

            <div>
                <h1>SportsPro Technical Support</h1>
                <p>Sports management software for the sports enthusiast</p>
            </div>
            <!-- Logout -->
            <button
                id="logoutButton"
                class="btn btn-header">
                Logout
            </button>

        </div>
    </header>
    
    <!-- Main Content -->
    <main class="container">
        <div class="main-panel">
            <div class="header-section">
                <h2>Display Incidents</h2>
                <a href="index.html">Home</a>
            </div>

            <!-- Incidents Table -->
            <div class="incidents-panel mb-4">
                <h3>Incidents</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Customer</th>
                                <th>Product</th>
                                <th>Technician</th>
                                <th>Date Opened</th>
                                <th>Date Closed</th>
                                <th>Title</th>
                            </tr>
                        </thead>
                        <tbody id="incidentsTable">
                            <!-- Dynamic incident data from API -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Incident Details (Initially hidden - shown when incident is selected) -->
            <div id="incidentDetailsPanel" class="incident-details-panel hidden">
                <h3 id="incidentHeading">Incident Details</h3>
                <div class="incident-details">
                    <div class="detail-row">
                        <div class="detail-label">Customer:</div>
                        <div id="incidentCustomer" class="detail-value"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Product:</div>
                        <div id="incidentProduct" class="detail-value"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Technician:</div>
                        <div id="incidentTechnician" class="detail-value"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Date Opened:</div>
                        <div id="incidentDateOpened" class="detail-value"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Date Closed:</div>
                        <div id="incidentDateClosed" class="detail-value"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Title:</div>
                        <div id="incidentTitle" class="detail-value"></div>
                    </div>
                    <div class="detail-row full-width">
                        <div class="detail-label">Description:</div>
                        <div id="incidentDescription" class="detail-value description-box"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2025 SportsPro, Inc.</p>
        </div>
    </footer>
    <script src="js/api.js"></script>
    <script src="js/auth_context.js"></script>
    <script src="js/display_incidents.js"></script>
</body>
</html>
