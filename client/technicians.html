<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Technicians - SportsPro Technical Support</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-content">

            <div>
                <h1>SportsPro Technical Support</h1>
                <p>Sports management software for the sports enthusiast</p>
            </div>
            <!-- Logout -->
            <button
                id="logoutButton"
                class="btn btn-header">
                Logout
            </button>

        </div>
    </header>
    
    <!-- Main Content -->
    <main class="container">
        <div class="main-panel">
            <div class="header-section">
                <h2>Technician List</h2>
                <a href="index.html">Home</a>
            </div>
            
            <!-- Technicians Table -->
            <div class="table-container mb-4">
                <table>
                    <thead>
                        <tr>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="techniciansTable">
                        <!-- Dynamic technician data from API -->
                    </tbody>
                </table>
            </div>
            
            <!-- Add Technician Form -->
            <div class="form-panel">
                <h3>Add Technician</h3>
                <div class="form-group">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName">
                </div>
                
                <div class="form-group">
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName">
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password">
                </div>
                
                <button type="submit" id="addTechnicianButton" class="btn btn-primary">Add Technician</button>
            </div>
            <p id="technicianMessage" class="success-message"></p>
        </div>
    </main>
    
    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2025 SportsPro, Inc.</p>
        </div>
    </footer>
    <script src="js/auth_context.js"></script>
    <script src="js/api.js"></script>
    <script src="js/technicians.js"></script>
</body>
</html>
